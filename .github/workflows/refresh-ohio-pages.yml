name: Refresh Ohio pages from the directory

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Shares the deploy workflow's group so the two never publish at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: OhioWeed

      - uses: actions/checkout@v4
        with:
          repository: travisvought-byte/ohio-cannabis-directory
          path: ohio-cannabis-directory

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install directory build requirements
        run: pip install -r ohio-cannabis-directory/requirements.txt

      - name: Rebuild the Ohio pages
        working-directory: OhioWeed
        run: python3 scripts/mirror_directory.py ../ohio-cannabis-directory --out .

      - name: Commit the refresh
        id: commit
        working-directory: OhioWeed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The directory has not changed since the last refresh."
            exit 0
          fi
          git commit -m "Refresh Ohio pages from ohio-cannabis-directory"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with the built-in token does not start other workflows, so the
      # deploy happens here rather than waiting for pages.yml to notice.
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: OhioWeed

      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true'
